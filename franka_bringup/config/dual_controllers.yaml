# Dual-arm torque bridge to mujoco-mpc's FR3_H_Gripper_Dual task.
# Owns the /mjpc_bridge_dual shared-memory region; mjpc attaches to it.
# No k_gains/d_gains on purpose: this controller passes the planner's feedforward
# torque through (filter + slew limit + ceiling), it does not close a PD loop.
# arm_1 -> bridge indices 0-6, arm_2 -> 7-13. That order is part of the protocol and
# must match the l_/r_ prefixes in the mjpc model.
mjpc_dual_bridge_controller:
  ros__parameters:
    arm_count: 2
    arm_1:
      arm_id: left
    arm_2:
      arm_id: right
